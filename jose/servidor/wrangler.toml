name = "jose"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

# Endereço próprio (a rede Wi-Fi de casa não alcança *.workers.dev). O DNS é criado pela Cloudflare.
routes = [{ pattern = "jose.corretormarcojunior.com.br", custom_domain = true }]

# Interface (build do Vite) servida pelo mesmo Worker.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/saude"]

[ai]
binding = "AI"

# O prompt do José (.md) entra no Worker como texto.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "jose"
# Preencher com o id devolvido por `wrangler d1 create jose` (ver README).
database_id = "44bc8c56-0e72-4aa8-8da7-e45749d90673"
migrations_dir = "migracoes"

# Backup semanal do D1: toda semana (domingo 06:00 UTC = 03:00 em São Paulo) o Worker grava um .sql no R2.
# Exige o R2 ativado na conta e `wrangler r2 bucket create jose-backups` (ver README, "Backup semanal").
[triggers]
crons = ["0 6 * * 0"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "jose-backups"

[vars]
MODELO_PADRAO = "claude-haiku-5-5"
MODELO_PROFUNDO = "claude-sonnet-5-5"
LIMITE_MENSAGENS_DIA = "200"

# Logs do Worker (só ids, tempos, tokens e erros; nunca o conteúdo das mensagens).
[observability]
enabled = true
